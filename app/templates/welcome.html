<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Battlefield</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome {
            text-align: center;
            padding: 40px 24px;
            max-width: 560px;
        }
        h1 {
            font-size: 42px;
            color: #00d9ff;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            color: #aaa;
            line-height: 1.6;
        }
        .magic-line {
            width: 60px;
            height: 3px;
            background: #0f3460;
            margin: 0 auto 20px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="welcome">
        <h1>🗺️ Live Battlefield</h1>
        <div class="magic-line"></div>
        <p>A live, map-based team battle game.</p>
    </div>
</body>
</html>
