<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr.settings.title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #00d9ff; }
        h2 { color: #00d9ff; margin-bottom: 15px; }
        h3 { color: #00d9ff; margin-bottom: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00d9ff;
            text-decoration: none;
            padding: 8px 15px;
            background: #16213e;
            border-radius: 5px;
        }
        .nav-link:hover { background: #0f3460; }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background: #00d9ff; color: #1a1a2e; }
        .btn-primary:hover { background: #00b8d4; }
        .modes-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .mode-card {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #00d9ff;
        }
        .mode-card.disabled {
            border-left-color: #555;
            opacity: 0.6;
        }
        .mode-card h3 { margin-bottom: 5px; }
        .mode-card p.description {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .mode-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .mode-controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #eee;
            font-size: 14px;
        }
        .mode-controls input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .mode-controls input[type="number"] {
            width: 60px;
            padding: 6px;
            border-radius: 5px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #eee;
            font-size: 14px;
        }
        textarea:focus, input:focus { outline: none; border-color: #00d9ff; }
        .coming-soon {
            color: #555;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background: #16213e;
            border-radius: 8px;
            border: 2px dashed #333;
        }
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            z-index: 1000;
        }
        #toast.success { background: #4caf50; color: white; }
        #toast.error { background: #f44336; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
            <a class="nav-link" id="back-link" style="margin-bottom:0;">{{ tr.settings.back }}</a>
            <select onchange="switchLanguage(this.value)" style="padding:6px 10px;font-size:13px;border:2px solid #0f3460;border-radius:5px;background:#1a1a2e;color:#eee;cursor:pointer;">
                <option value="en" {% if current_lang == 'en' %}selected{% endif %}>{{ tr.lang.en }}</option>
                <option value="nl" {% if current_lang == 'nl' %}selected{% endif %}>{{ tr.lang.nl }}</option>
            </select>
        </div>
        <h1>{{ tr.settings.title }}</h1>

        <div class="modes-grid">
            <!-- Bomb Drip -->
            <div class="mode-card" id="card-bomb-drip">
                <h3>{{ tr.settings.bomb_drip }}</h3>
                <p class="description">{{ tr.settings.bomb_drip_desc }}</p>
                <div class="mode-controls">
                    <label>
                        <input type="checkbox" id="drip-enabled">
                        {{ tr.settings.enable }}
                    </label>
                    <label>
                        <input type="number" id="drip-bombs" value="1" min="1">
                        {{ tr.settings.bombs_every }}
                    </label>
                    <label>
                        <input type="number" id="drip-minutes" value="1" min="1">
                        {{ tr.settings.minutes }}
                    </label>
                    <label>
                        <input type="number" id="drip-max" value="100" min="1">
                        {{ tr.settings.max_bombs }}
                    </label>
                    <button class="btn btn-primary" onclick="saveBombDrip()">{{ tr.settings.save }}</button>
                </div>
            </div>

            <!-- Quiz Mode -->
            <div class="mode-card" id="card-quiz">
                <h3>{{ tr.settings.quiz_title }}</h3>
                <p class="description">{{ tr.settings.quiz_desc }}</p>
                <div class="mode-controls" style="flex-direction:column;align-items:stretch;">
                    <div style="display:flex;gap:15px;flex-wrap:wrap;align-items:center;">
                        <label><input type="checkbox" id="quiz-enabled"> {{ tr.settings.enable }}</label>
                        <label>{{ tr.settings.quiz_total }} <input type="number" id="quiz-total" value="100" min="1" style="width:60px;"></label>
                    </div>
                    <div id="quiz-questions-area" style="display:none;margin-top:15px;">
                        <div style="margin-bottom:8px;"><strong>{{ tr.settings.quiz_questions }}</strong></div>
                        <div id="quiz-questions-list"></div>
                        <button class="btn btn-primary" onclick="addQuestion()" style="font-size:12px;padding:5px 10px;margin-top:8px;">+ {{ tr.settings.quiz_add_q }}</button>
                        <button class="btn btn-primary" onclick="saveQuiz()" style="margin-top:10px;">{{ tr.settings.quiz_save }}</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const TR = {{ tr_json|safe }};
        function _(key, params) {
            let val = TR;
            for (const part of key.split('.')) {
                val = val[part];
                if (val === undefined) return key;
            }
            if (typeof val !== 'string') return key;
            if (params) {
                for (const [k, v] of Object.entries(params)) {
                    val = val.replace('{' + k + '}', v);
                }
            }
            return val;
        }

        function getGmToken() {
            const m = window.location.pathname.match(/^\/(game-master|admin)\/([^/]+)/);
            return m ? m[2] : '';
        }

        async function apiCall(url, method, body) {
            try {
                const token = getGmToken();
                const sep = url.includes('?') ? '&' : '?';
                const options = { method: method || 'GET' };
                if (body) {
                    options.headers = { 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(body);
                }
                const resp = await fetch(url + sep + 'gm_token=' + encodeURIComponent(token), options);
                return await resp.json();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
                return null;
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = type;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        (function setBackLink() {
            const m = window.location.pathname.match(/^\/(game-master|admin)\/([^/]+)/);
            if (m) {
                const link = document.getElementById('back-link');
                link.href = '/' + m[1] + '/' + m[2];
                link.textContent = m[1] === 'game-master' ? _('settings.back') : _('settings.back_admin');
            }
        })();

        function switchLanguage(lang) {
            window.location.href = window.location.pathname + '?lang=' + lang;
        }

        async function loadBombDrip() {
            const state = await apiCall('/api/state');
            if (!state) return;

            document.getElementById('drip-enabled').checked = state.trickle_enabled || false;
            document.getElementById('drip-bombs').value = state.trickle_bombs_per_interval || 1;
            document.getElementById('drip-minutes').value = state.trickle_interval_minutes || 1;
            document.getElementById('drip-max').value = state.max_bombs || 100;
        }

        async function saveBombDrip() {
            const enabled = document.getElementById('drip-enabled').checked;
            const bombs = parseInt(document.getElementById('drip-bombs').value) || 1;
            const minutes = parseInt(document.getElementById('drip-minutes').value) || 1;
            const max = parseInt(document.getElementById('drip-max').value) || 100;

            const result = await apiCall('/api/quick/trickle_settings', 'POST', {
                enabled: enabled,
                bombs_per_interval: bombs,
                interval_minutes: minutes,
                max_bombs: max,
            });
            showToast(result.message, result.success ? 'success' : 'error');
        }

        // --- Quiz ---
        let quizQuestions = [];

        function renderQuizQuestions() {
            const list = document.getElementById('quiz-questions-list');
            list.innerHTML = quizQuestions.map((q, qi) => `
                <div style="background:#0f3460;border-radius:6px;padding:12px;margin-bottom:10px;">
                    <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
                        <span style="color:#888;font-size:12px;">Q${qi + 1}</span>
                        <input type="text" value="${q.question_text.replace(/"/g,'&quot;')}" onchange="quizQuestions[${qi}].question_text=this.value" placeholder="Question text" style="flex:1;padding:6px;font-size:13px;border-radius:4px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;">
                        <button class="btn btn-danger" style="padding:4px 8px;font-size:11px;" onclick="removeQuestion(${qi})">✕</button>
                    </div>
                    ${q.answers.map((a, ai) => `
                        <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;padding-left:20px;">
                            <input type="radio" name="correct-${qi}" ${a.is_correct?'checked':''} onchange="quizQuestions[${qi}].answers.forEach((x,i)=>{x.is_correct=i===${ai}})">
                            <input type="text" value="${a.answer_text.replace(/"/g,'&quot;')}" onchange="quizQuestions[${qi}].answers[${ai}].answer_text=this.value" placeholder="Answer" style="flex:1;padding:5px;font-size:12px;border-radius:3px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;">
                            <input type="number" value="${a.bomb_value}" onchange="quizQuestions[${qi}].answers[${ai}].bomb_value=parseInt(this.value)||0" style="width:50px;padding:5px;font-size:12px;border-radius:3px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;" title="Bombs">
                            <span style="font-size:11px;color:#888;">💣</span>
                            <button class="btn btn-danger" style="padding:2px 6px;font-size:10px;" onclick="quizQuestions[${qi}].answers.splice(${ai},1);renderQuizQuestions()">✕</button>
                        </div>
                    `).join('')}
                    <button class="btn btn-primary" style="padding:4px 10px;font-size:11px;margin-left:20px;margin-top:4px;" onclick="addAnswer(${qi})">+ {{ tr.settings.quiz_add_a }}</button>
                </div>
            `).join('');
        }

        function addQuestion() {
            const total = parseInt(document.getElementById('quiz-total').value) || 100;
            const perQ = quizQuestions.length > 0 ? Math.floor(total / (quizQuestions.length + 1)) : total;
            quizQuestions.push({ question_text: '', answers: [{ answer_text: '', bomb_value: perQ, is_correct: true }] });
            renderQuizQuestions();
        }

        function addAnswer(qi) {
            quizQuestions[qi].answers.push({ answer_text: '', bomb_value: 0, is_correct: false });
            renderQuizQuestions();
        }

        function removeQuestion(qi) {
            quizQuestions.splice(qi, 1);
            renderQuizQuestions();
        }

        async function loadQuiz() {
            const state = await apiCall('/api/state');
            if (!state) return;
            document.getElementById('quiz-enabled').checked = state.quiz_enabled || false;
            document.getElementById('quiz-total').value = state.quiz_total_bombs || 100;
            document.getElementById('quiz-questions-area').style.display = state.quiz_enabled ? 'block' : 'none';

            const data = await apiCall('/api/quiz/questions');
            if (data && data.questions) {
                quizQuestions = data.questions;
                renderQuizQuestions();
            }
        }

        document.getElementById('quiz-enabled').addEventListener('change', function() {
            document.getElementById('quiz-questions-area').style.display = this.checked ? 'block' : 'none';
        });

        async function saveQuiz() {
            const enabled = document.getElementById('quiz-enabled').checked;
            const total = parseInt(document.getElementById('quiz-total').value) || 100;

            let result = await apiCall('/api/quick/quiz_settings', 'POST', { enabled: enabled, total_bombs: total });
            if (!result || !result.success) {
                showToast(result ? result.message : 'Error', 'error');
                return;
            }

            if (enabled && quizQuestions.length > 0) {
                // Auto-distribute bombs
                const perQ = Math.floor(total / quizQuestions.length);
                quizQuestions.forEach(q => {
                    const correct = q.answers.find(a => a.is_correct);
                    q.answers.forEach(a => {
                        if (a.is_correct || !correct) {
                            a.bomb_value = perQ;
                        } else if (a.bomb_value === undefined || a.bomb_value === 0) {
                            a.bomb_value = 0;
                        }
                    });
                });

                result = await apiCall('/api/quiz/questions', 'POST', { questions: quizQuestions });
                if (result && result.success) {
                    quizQuestions = result.questions || quizQuestions;
                    renderQuizQuestions();
                }
            }
            showToast((result && result.message) || 'Quiz settings saved!', 'success');
        }

        loadBombDrip();
        loadQuiz();
    </script>
</body>
</html>
