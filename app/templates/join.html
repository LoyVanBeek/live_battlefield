<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr.join.title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .join-container {
            background: #16213e;
            padding: 40px;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #00d9ff;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .game-name {
            color: #888;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 14px;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 6px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #eee;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group select:focus,
        .form-group input:focus {
            border-color: #00d9ff;
        }
        .form-group select option {
            background: #1a1a2e;
            color: #eee;
        }
        .btn-join {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #4caf50;
            color: white;
            transition: background 0.2s;
        }
        .btn-join:hover {
            background: #45a049;
        }
        .btn-join:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            display: block;
            background: #f44336;
            color: white;
        }
        .message.success {
            display: block;
            background: #4caf50;
            color: white;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #555;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .lang-select {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 5px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #eee;
            cursor: pointer;
        }
        .game-status {
            margin-bottom: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <select class="lang-select" id="lang-select" onchange="switchLanguage(this.value)">
        <option value="en" {% if current_lang == 'en' %}selected{% endif %}>{{ tr.lang.en }}</option>
        <option value="nl" {% if current_lang == 'nl' %}selected{% endif %}>{{ tr.lang.nl }}</option>
    </select>

    <div class="join-container">
        <h1>{{ tr.join.heading }}</h1>
        <div class="game-name" id="game-name">{{ game_name }}</div>
        <div class="game-status" id="game-status"></div>

        <div id="join-form">
            <div class="form-group">
                <label for="team-color">{{ tr.join.choose_color }}</label>
                <select id="team-color">
                    <option value="">{{ tr.join.loading_colors }}</option>
                </select>
            </div>

            <div class="form-group">
                <label for="team-name">{{ tr.join.team_name }}</label>
                <input type="text" id="team-name" placeholder="{{ tr.join.placeholder_name }}" maxlength="100">
            </div>

            <div style="display:flex;gap:8px;">
                <button class="btn-join" id="btn-join" onclick="joinGame()" style="flex:1;">{{ tr.join.join_button }}</button>
                <button onclick="toggleHelp()" style="width:48px;height:48px;border:none;border-radius:6px;background:#0f3460;color:#eee;font-size:20px;cursor:pointer;flex-shrink:0;">❓</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display:none;"></div>
        <div id="message" class="message"></div>
    </div>

    <!-- Help Modal -->
    <div id="help-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;">
        <div style="background:#16213e;border-radius:12px;padding:30px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto;margin:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2 style="margin:0;">{{ tr.help_join.title }}</h2>
                <span onclick="toggleHelp()" style="cursor:pointer;font-size:28px;color:#888;">&times;</span>
            </div>
            <p style="margin-bottom:16px;line-height:1.5;">{{ tr.help_join.intro }}</p>
            <div style="margin-bottom:12px;">\u279c {{ tr.help_join.step1 }}</div>
            <div style="margin-bottom:12px;">\u279c {{ tr.help_join.step2 }}</div>
            <div style="margin-bottom:12px;">\u279c {{ tr.help_join.step3 }}</div>
            <div style="margin-bottom:12px;">\u279c {{ tr.help_join.step4 }}</div>
            <div style="margin-bottom:16px;">\u279c {{ tr.help_join.step5 }}</div>
            <button class="btn-join" onclick="toggleHelp()" style="margin-top:10px;">{{ tr.help.close }}</button>
        </div>
    </div>

    <script>
        const TR = {{ tr_json|safe }};
        function _(key, params) {
            let val = TR;
            for (const part of key.split('.')) {
                val = val[part];
                if (val === undefined) return key;
            }
            if (typeof val !== 'string') return key;
            if (params) {
                for (const [k, v] of Object.entries(params)) {
                    val = val.replace('{' + k + '}', v);
                }
            }
            return val;
        }
        function toggleHelp() {
            const m = document.getElementById('help-modal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        const INVITE_TOKEN = '{{ invite_token }}';

        function switchLanguage(lang) {
            document.cookie = 'lang=' + lang + ';max-age=' + (365 * 24 * 3600) + ';path=/';
            window.location.reload();
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        function setLoading(loading) {
            document.getElementById('btn-join').disabled = loading;
            document.getElementById('loading').style.display = loading ? 'block' : 'none';
            document.getElementById('join-form').style.opacity = loading ? '0.5' : '1';
        }

        async function loadJoinState() {
            try {
                const res = await fetch('/api/join-state/' + encodeURIComponent(INVITE_TOKEN));
                if (!res.ok) {
                    document.getElementById('join-form').innerHTML = '<p style="color:#f44336;">Game not found.</p>';
                    return;
                }
                const data = await res.json();

                const statusEl = document.getElementById('game-status');
                if (data.status === 'started') {
                    statusEl.textContent = _('join.game_started');
                    document.getElementById('join-form').style.display = 'none';
                    return;
                }
                if (data.status === 'ended') {
                    statusEl.textContent = _('join.game_ended');
                    document.getElementById('join-form').style.display = 'none';
                    return;
                }

                document.getElementById('game-name').textContent = data.game_name;

                const select = document.getElementById('team-color');
                select.innerHTML = '<option value="">' + _('join.select_color') + '</option>';
                if (data.available_colors && data.available_colors.length > 0) {
                    data.available_colors.forEach(function(color) {
                        const opt = document.createElement('option');
                        opt.value = color;
                        opt.textContent = color.toUpperCase();
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">' + _('join.game_full') + '</option>';
                    document.getElementById('btn-join').disabled = true;
                }

                document.getElementById('team-name').focus();
            } catch (e) {
                showMessage(_('join.failed_load'), 'error');
            }
        }

        async function joinGame() {
            const color = document.getElementById('team-color').value;
            const name = document.getElementById('team-name').value.trim();

            if (!color) {
                showMessage(_('join.select_color_error'), 'error');
                return;
            }

            setLoading(true);
            showMessage('', '');

            try {
                const res = await fetch('/api/join-game/' + encodeURIComponent(INVITE_TOKEN), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ team_color: color, name: name }),
                });
                const data = await res.json();

                if (data.success) {
                    showMessage(_('join.joined_redirect'), 'success');
                    setTimeout(function() {
                        window.location.href = data.team_url;
                    }, 800);
                } else {
                    showMessage(data.message || _('join.select_color_error'), 'error');
                    setLoading(false);
                }
            } catch (e) {
                showMessage(_('join.network_error'), 'error');
                setLoading(false);
            }
        }

        document.getElementById('team-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); joinGame(); }
        });
        document.getElementById('team-color').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); joinGame(); }
        });

        loadJoinState();
    </script>
</body>
</html>
